[project]
name = "lidemo"
version = "0.1.0"
description = "Ledelsesinformation demo on open crime statistics for Nordjyllands Politikreds"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "statsmodels>=0.14", "openpyxl>=3.1", "matplotlib>=3.7", "python-docx>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
